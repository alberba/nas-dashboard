# Agente del Servidor de apps (Oracle). Se une a la red privada del hub, sin
# publicar puertos. Ejecuta desde agent/: docker compose -f compose.apps.yaml up -d --build
name: hub-agent-apps
services:
  agent:
    build: .
    image: hub-agent:1
    container_name: hub-agent-apps
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    env_file: .env.apps
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      hub:
        aliases:
          - hub-agent-apps
networks:
  hub:
    external: true
    name: nas-dashboard_default
