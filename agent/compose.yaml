services:
  agent:
    build: .
    image: hub-agent:1
    container_name: hub-agent
    restart: unless-stopped
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    env_file: .env
    environment:
      MEDIA_STACK_ROOT: /media-stack
      APPDATA_ROOT: /media-stack-appdata
      HOST_ROLE: instance
      MEDIA_STACK_ENV_FILE: /media-stack-env/.env
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ${NAS_MEDIA_PATH:?Set NAS_MEDIA_PATH}:/nas/media
      - ${NAS_TORRENTS_PATH:?Set NAS_TORRENTS_PATH}:/nas/torrents
      - ${MEDIA_STACK_CHECKOUT_PATH:?Set MEDIA_STACK_CHECKOUT_PATH}:/media-stack:ro
      - ${MEDIA_STACK_APPDATA_PATH:?Set MEDIA_STACK_APPDATA_PATH}:/media-stack-appdata:ro
      # Only the dedicated .env directory is writable: rename needs the directory.
      - ${MEDIA_STACK_ENV_PATH:?Set MEDIA_STACK_ENV_PATH}:/media-stack-env:rw
