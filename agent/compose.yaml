services:
  agent:
    build: .
    image: hub-agent:1
    container_name: hub-agent
    restart: unless-stopped
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    env_file: .env
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ${NAS_MEDIA_PATH:?Set NAS_MEDIA_PATH}:/nas/media
      - ${NAS_TORRENTS_PATH:?Set NAS_TORRENTS_PATH}:/nas/torrents
