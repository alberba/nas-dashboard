name: nas-dashboard
services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: hub
      POSTGRES_DB: hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U hub -d hub"]
      interval: 5s
      timeout: 3s
      retries: 15
  migrate:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_DOMAIN: ${NEXT_PUBLIC_APP_DOMAIN:-example.com}
    image: nas-dashboard:local
    env_file: .env
    command: [pnpm, db:migrate]
    depends_on:
      db:
        condition: service_healthy
  app:
    image: nas-dashboard:local
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
    ports:
      - ${BIND_IP:-127.0.0.1}:${PORT:-4323}:3000
      - 127.0.0.1:${PRIVATE_PORT:-4324}:3000
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/setup').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    image: nas-dashboard:local
    restart: unless-stopped
    env_file: .env
    command: [pnpm, worker]
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres:
